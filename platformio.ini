[platformio]
default_envs = teensy40
src_dir = src

[env]
framework = arduino
monitor_speed = 115200

[env:teensy40]
platform = teensy
board = teensy40
build_src_filter = +<teensy/main.cpp>

[env:mega]
platform = atmelavr
board = megaatmega2560
build_src_filter = +<mega/main.cpp>

[env:uno]
platform = atmelavr
board = uno
build_src_filter = +<uno/main.cpp>